project:
  name: electronics_price_pressure

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  db_dir: data/db
  model_dir: artifacts/models
  metrics_dir: artifacts/metrics
  predictions_dir: artifacts/predictions

fred:
  series_id: PCU33443344
  url_template: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}"
  indicators:
    - source: ny_fed_gscpi
      name: gscpi
      url: "https://www.newyorkfed.org/medialibrary/research/interactives/gscpi/downloads/gscpi_data.xlsx"
    - series_id: DCOILWTICO
      name: wti_oil_price

storage:
  mongo:
    uri: "mongodb://localhost:27017"
    database: electronics_price_pressure
    raw_news_collection: raw_news
    clean_news_collection: clean_news
    test_news_collection: test_news
    test_clean_news_collection: test_clean_news
    test_enriched_news_collection: test_enriched_news
  sqlite:
    fred_db_path: data/db/fred.sqlite3

news:
  use_gdelt: false
  use_guardian: true
  use_hackernews: false
  use_newsapi: true
  use_newsdata: false
  use_nyt: false
  use_reuters: false
  use_webzio: false
  start_date: "1998-01-01"
  end_date: today
  query_mode: broad
  query: '(semiconductor OR semiconductors OR microchip OR microchips OR "computer chip" OR "computer chips" OR chipmaker OR chipmakers OR "chip industry" OR "silicon chip" OR "integrated circuit" OR "integrated circuits" OR DRAM OR NAND OR SSD OR "memory chip" OR "memory chips" OR "electronic components" OR "consumer electronics")'
  query_strict: '((semiconductor OR semiconductors OR microchip OR microchips OR "computer chip" OR "computer chips" OR chipmaker OR chipmakers OR "chip industry" OR DRAM OR NAND OR SSD OR "memory chip" OR "memory chips") AND (price OR prices OR shortage OR shortages OR tariff OR tariffs OR supply OR demand OR "export controls" OR "supply chain"))'
  query_broad: '(semiconductor OR semiconductors OR microchip OR microchips OR "computer chip" OR "computer chips" OR chipmaker OR chipmakers OR "chip industry" OR "silicon chip" OR "integrated circuit" OR "integrated circuits" OR DRAM OR NAND OR SSD OR "memory chip" OR "memory chips" OR "electronic components" OR "consumer electronics")'
  query_webzio: '(semiconductor OR microchip OR chips OR memory) (price OR shortage OR supply)'
  max_records_per_window: 50
  window: monthly
  sleep_seconds: 5
  max_retries: 3
  retry_base_sleep: 3
  guardian:
    api_key_env: GUARDIAN_API_KEY
    order_by: newest
    show_fields: bodyText,thumbnail
    min_request_interval_seconds: 1.2
    max_pages_per_window: 3
  hackernews:
    endpoint: https://hn.algolia.com/api/v1/search_by_date
    query: semiconductor
    queries:
      - semiconductor
    tags: story
    newest_first: true
    months_per_request: 3
    max_pages_per_window: 1
    hits_per_page: 100
    max_requests_per_run: 100
    min_request_interval_seconds: 0.5
    require_url: true
    require_title: true
    min_points: 0
    high_attention_min_points: 100
    high_attention_min_comments: 50
  hackernews_link_fetch:
    timeout_seconds: 20
    min_request_interval_seconds: 1.0
    max_response_bytes: 2000000
    max_chars: 15000
    min_text_chars: 300
  newsapi:
    api_key_env: NEWSAPI_KEY
    endpoint: everything
    lookback_days: 30
    language: en
    sort_by: publishedAt
    min_request_interval_seconds: 1.2
    max_pages: 1
  newsdata:
    api_key_env: NEWSDATA_API_KEY
    endpoint: archive
    language: en
    min_request_interval_seconds: 31
  nyt:
    api_key_env: NYT_API_KEY
    sort: newest
    newest_first: true
    min_request_interval_seconds: 13
    max_pages_per_window: 1
    max_requests_per_run: 100
  reuters:
    api_key_env: RAPIDAPI_REUTERS_KEY
    host_env: RAPIDAPI_REUTERS_HOST
    host: reuters-business-and-financial-news.p.rapidapi.com
    endpoint_mode: keyword_date_range
    keyword: semiconductor
    keywords:
      - semiconductor
    newest_first: true
    min_request_interval_seconds: 1.0
    max_pages_per_window: 1
    months_per_request: 3
    max_requests_per_run: 30
    page_size: 20
    filter_relevance: true
    min_content_chars: 500
    require_pressure_term: true
    required_terms:
      - semiconductor
      - semiconductors
      - microchip
      - microchips
      - "computer chip"
      - "computer chips"
      - "AI chip"
      - "AI chips"
      - "chip industry"
      - chipmaker
      - chipmakers
      - "memory chip"
      - "memory chips"
      - DRAM
      - NAND
      - HBM
      - "high bandwidth memory"
      - "integrated circuit"
      - "integrated circuits"
    pressure_terms:
      - price
      - prices
      - shortage
      - shortages
      - supply
      - demand
      - tariff
      - tariffs
      - "export control"
      - "export controls"
      - restriction
      - restrictions
      - inventory
      - inventories
      - oversupply
      - production
      - capacity
      - manufacturing
      - regulation
      - regulations
    exclude_terms:
      - "potato chip"
      - "potato chips"
      - "poker chip"
      - "poker chips"
      - "casino chip"
      - "casino chips"
      - "fish and chips"
      - "chocolate chip"
      - "blue chip"
      - "blue-chip"
  webzio:
    api_key_env: WEBZIO_API_KEY
    endpoint: newsApiLite
    language: english
    # Note: newsApiLite doesn't support sorting - returns results by relevancy
    min_request_interval_seconds: 1.5
    max_pages_per_window: 2
    # Note: newsApiLite has strict limits - 1000 monthly calls, 10 results per call
    include_fields:
      - title
      - text
      - url
      - published
      - author
      - thread.site
    performance:
      deduplicate: true
      timeout_seconds: 30

ai_enrichment:
  enabled: false
  backend: groq
  model:
  api_key_env: GROQ_API_KEY
  max_articles_per_run: 3
  max_chars_per_article: 3000
  min_prefilter_relevance_score: 0.5
  request_timeout_seconds: 60
  max_retries: 5
  request_sleep_seconds: 8
  stop_on_rate_limit: true

ai_lab_export:
  output_path: ai_lab/upload_bundle/news_to_enrich.jsonl
  bundle_dir: ai_lab/upload_bundle
  limit:
  batch_size: 100
  max_chars: 12000
  prefilter: true
  default_model: $HOME/models/Qwen2.5-32B-Instruct
  default_gpus: 4
  default_max_model_len: 4096
  judge_model: $HOME/models/Mistral-Small-24B-Instruct-2501
  judge_sample_size: 500

features:
  use_legacy_text_features: false
  use_vader_sentiment: false
  keywords:
    - semiconductor
    - supply chain
    - shortage
    - tariff
    - memory
    - nand
    - dram
    - ssd
    - ram
    - electronics
    - ai demand

target:
  low_quantile: 0.33
  high_quantile: 0.67

model:
  test_size_months: 36
  validation_size_months: 36
  random_state: 42
  feature_sets:
    - baseline
    - ai_compact
    - baseline_with_persistence
    - ai_compact_with_persistence
  candidates:
    - logistic_regression
    - xgboost
  selection_metric: macro_f1
  recent_period_experiment:
    start_years:
      - 2020
      - 2021
      - 2022
      - 2023
    validation_size_months: 12
    test_size_months: 12
    min_train_months: 24
